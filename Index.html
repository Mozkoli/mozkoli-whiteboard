<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozkoli Whiteboard Pro</title>
    <style>
        body { background-color: #0a0a0f; color: #e5e5e5; font-family: system-ui, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #D4AF37; font-size: 24px; margin-bottom: 5px; }
        p { color: #888; font-size: 14px; text-align: center; margin-bottom: 20px; }
        textarea { width: 100%; max-width: 600px; height: 100px; background: #121218; border: 1px solid #27272a; color: #fff; padding: 15px; border-radius: 8px; font-size: 16px; margin-bottom: 15px; resize: vertical; box-sizing: border-box; }
        button { width: 100%; max-width: 600px; padding: 15px; background: #D4AF37; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 15px; color: #D4AF37; font-weight: bold; text-align: center; min-height: 20px; }
        #canvas-container { position: relative; margin-top: 20px; width: 100%; max-width: 600px; aspect-ratio: 4/3; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
        canvas { width: 100%; height: 100%; display: block; }
        .controls { display: flex; gap: 10px; margin-top: 15px; width: 100%; max-width: 600px; }
        .controls button { flex: 1; background: #4F46E5; color: white; }
        .controls button.record { background: #DC2626; }
    </style>
</head>
<body>
    <h1>Mozkoli Whiteboard</h1>
    <p>Type your script. The AI will handwrite it, draw it, and speak it.</p>
    <textarea id="scriptInput">When you hear the word Mermaid, you think of a fairy tale. But in Africa, the water spirit is a god. She is beautiful, she is wealthy, and she is dangerous.</textarea>
    <button id="startBtn" onclick="startAnimation()">Generate &amp; Animate</button>
    <div id="status">Ready</div>
    <div id="canvas-container"><canvas id="whiteboard" width="800" height="600"></canvas></div>
    <div class="controls">
        <button id="recordBtn" class="record" onclick="toggleRecording()">Start Recording</button>
        <button onclick="downloadVideo()">Download Video</button>
    </div>

<script>
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const recordBtn = document.getElementById('recordBtn');
    const handwritingFont = 'italic 38px "Brush Script MT", "Segoe Script", cursive';

    let scenes = [];
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];
    let recordingStream;

    function parseScript(text) {
        return text.match(/[^.!?]+(?:[.!?]+|$)/g)
            ?.map(sentence => sentence.trim())
            .filter(Boolean) ?? [];
    }

    async function fetchSketch(prompt) {
        const encoded = encodeURIComponent(prompt + ", simple black and white line art sketch on a white background, whiteboard style, minimalist");
        const url = `https://image.pollinations.ai/prompt/${encoded}?width=800&height=600&nologo=true`;
        const img = new Image();
        img.crossOrigin = "Anonymous";
        return new Promise((resolve, reject) => {
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = url;
        });
    }

    function speak(text) {
        return new Promise(resolve => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            const voice = window.speechSynthesis.getVoices().find(v => /Male|UK/i.test(v.name));
            if (voice) utterance.voice = voice;
            utterance.onend = resolve;
            utterance.onerror = event => { console.warn("Speech error", event); resolve(); };
            window.speechSynthesis.speak(utterance);
        });
    }

    function layoutHandwriting(text) {
        ctx.font = handwritingFont;
        const left = 50;
        const maxX = canvas.width - 50;
        const lineHeight = 62;
        const chars = [];
        let x = left;
        let y = canvas.height / 2;
        let line = 0;

        for (const char of text) {
            if (char === '\n') {
                x = left;
                y += lineHeight;
                line++;
                continue;
            }
            const width = ctx.measureText(char).width;
            if (x + width > maxX && x > left) {
                x = left;
                y += lineHeight;
                line++;
            }
            // Tiny per-letter variations help the fallback cursive font feel less mechanically placed.
            const seed = chars.length;
            chars.push({
                char,
                x,
                y: y + Math.sin(seed * 1.7) * 1.4,
                width,
                rotation: Math.sin(seed * 2.3) * 0.025,
                line
            });
            x += width + (char === ' ' ? 1 : Math.sin(seed * 2.1) * 0.55);
        }

        const lineCount = line + 1;
        const offset = (canvas.height - lineCount * lineHeight) / 2 + 25 - canvas.height / 2;
        chars.forEach(item => { item.y += offset; });
        return chars;
    }

    function drawGlyph(item, reveal = 1) {
        if (!item.char || reveal <= 0) return;
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rotation);
        ctx.beginPath();
        ctx.rect(-2, -50, Math.max(0, item.width * reveal + 3), 60);
        ctx.clip();
        ctx.fillText(item.char, 0, 0);
        ctx.restore();
    }

    function drawPenTip(x, y, angle = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.moveTo(-5, -4);
        ctx.lineTo(13, 0);
        ctx.lineTo(-5, 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#7f1d1d';
        ctx.beginPath();
        ctx.arc(11, 0, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawHandwriting(text, duration) {
        return new Promise(resolve => {
            const chars = layoutHandwriting(text);
            const weights = chars.map(item => {
                const punctuationPause = /[,;:]/.test(item.char) ? 2.2 : /[.!?]/.test(item.char) ? 3.8 : 1;
                return (0.65 + Math.min(item.width / 22, 1.15)) * punctuationPause;
            });
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0) || 1;
            const start = performance.now();
            let elapsedWeight = 0;
            const intervals = weights.map(weight => {
                const interval = [elapsedWeight / totalWeight, (elapsedWeight + weight) / totalWeight];
                elapsedWeight += weight;
                return interval;
            });

            function frame(now) {
                const progress = Math.min((now - start) / (duration * 1000), 1);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = handwritingFont;
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#171717';

                let active = null;
                let activeReveal = 0;
                chars.forEach((item, index) => {
                    const [from, to] = intervals[index];
                    if (progress >= to) drawGlyph(item);
                    else if (progress >= from) {
                        active = item;
                        activeReveal = Math.min((progress - from) / (to - from), 1);
                        drawGlyph(item, activeReveal);
                    }
                });

                if (active) drawPenTip(active.x + active.width * activeReveal, active.y - 7, active.rotation);
                if (progress < 1) requestAnimationFrame(frame);
                else resolve();
            }
            requestAnimationFrame(frame);
        });
    }

    // A broad moving eraser clears the written line, with a soft edge and a visible eraser block.
    function eraseHandwriting(text, duration = 1100) {
        return new Promise(resolve => {
            const chars = layoutHandwriting(text);
            const start = performance.now();

            function frame(now) {
                const progress = Math.min((now - start) / duration, 1);
                const eraseX = -40 + (canvas.width + 80) * progress;
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = handwritingFont;
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#171717';
                chars.forEach(item => drawGlyph(item));

                // Wipe only the portion already passed by the eraser.
                ctx.clearRect(0, 0, Math.max(0, eraseX), canvas.height);
                ctx.fillStyle = 'rgba(255,255,255,0.96)';
                ctx.fillRect(eraseX - 18, 0, 36, canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(eraseX - 4, 0, 8, canvas.height);
                ctx.fillStyle = 'rgba(210,210,210,0.45)';
                ctx.fillRect(eraseX + 5, 0, 3, canvas.height);

                if (progress < 1) requestAnimationFrame(frame);
                else {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    resolve();
                }
            }
            requestAnimationFrame(frame);
        });
    }

    // Reveals the picture in overlapping marker strokes that sweep back and forth over the board.
    function animateDrawing(img, duration) {
        return new Promise(resolve => {
            const mask = document.createElement('canvas');
            mask.width = canvas.width;
            mask.height = canvas.height;
            const maskCtx = mask.getContext('2d');
            const spacing = 68;
            const rows = Math.ceil(canvas.height / spacing) + 1;
            const start = performance.now();
            const totalLength = rows * (canvas.width + 70);

            function frame(now) {
                const progress = Math.min((now - start) / (duration * 1000), 1);
                const distance = progress * totalLength;
                maskCtx.clearRect(0, 0, mask.width, mask.height);
                maskCtx.lineWidth = 92;
                maskCtx.lineCap = 'round';
                maskCtx.lineJoin = 'round';
                maskCtx.strokeStyle = '#fff';

                let remaining = distance;
                let penX = 0;
                let penY = 0;
                let penAngle = 0;
                for (let row = 0; row < rows; row++) {
                    const y = row * spacing + spacing / 2;
                    const reverse = row % 2 === 1;
                    const x0 = reverse ? canvas.width + 35 : -35;
                    const x1 = reverse ? -35 : canvas.width + 35;
                    const length = Math.abs(x1 - x0);
                    const covered = Math.max(0, Math.min(remaining, length));
                    if (covered > 0) {
                        const xEnd = x0 + (reverse ? -covered : covered);
                        maskCtx.beginPath();
                        maskCtx.moveTo(x0, y);
                        maskCtx.lineTo(xEnd, y + Math.sin(covered / 55) * 2);
                        maskCtx.stroke();
                        penX = xEnd;
                        penY = y;
                        penAngle = reverse ? Math.PI : 0;
                    }
                    remaining -= length;
                }

                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'destination-in';
                ctx.drawImage(mask, 0, 0);
                ctx.globalCompositeOperation = 'source-over';

                if (progress < 1) {
                    drawPenTip(penX, penY, penAngle);
                    requestAnimationFrame(frame);
                } else resolve();
            }
            requestAnimationFrame(frame);
        });
    }

    async function startAnimation() {
        const text = document.getElementById('scriptInput').value.trim();
        scenes = parseScript(text);
        if (scenes.length === 0) return alert("Please enter a valid script.");

        startBtn.disabled = true;
        let hasFailed = false;
        try {
            for (let i = 0; i < scenes.length; i++) {
                const sentence = scenes[i];
                status.innerText = `Generating scene ${i + 1} of ${scenes.length}...`;
                try {
                    const img = await fetchSketch(sentence);
                    status.innerText = `Writing scene ${i + 1}...`;
                    const wordCount = sentence.split(/\s+/).length;
                    const speechDuration = Math.max(wordCount / 2.5, 3);
                    const writingDuration = Math.max(sentence.length * 0.065, 2.8);
                    await Promise.all([speak(sentence), drawHandwriting(sentence, writingDuration)]);
                    status.innerText = `Erasing scene ${i + 1}...`;
                    await eraseHandwriting(sentence);
                    status.innerText = `Drawing scene ${i + 1}...`;
                    await animateDrawing(img, speechDuration);
                    await new Promise(resolve => setTimeout(resolve, 900));
                } catch (error) {
                    console.error(error);
                    hasFailed = true;
                    status.innerText = `Error on scene ${i + 1}. Skipping...`;
                }
            }
            status.innerText = hasFailed ? "Finished, but some scenes failed to load." : "Video Complete!";
        } finally {
            startBtn.disabled = false;
        }
    }

    function toggleRecording() {
        if (isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerText = "Start Recording";
            recordBtn.style.background = "#DC2626";
            status.innerText = "Finalizing recording...";
            return;
        }
        if (!canvas.captureStream || !window.MediaRecorder) {
            return alert("Canvas recording is not supported in this browser.");
        }
        const mimeType = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
            .find(type => MediaRecorder.isTypeSupported(type));
        if (!mimeType) return alert("This browser does not support WebM recording.");

        recordedChunks = [];
        recordingStream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(recordingStream, { mimeType, videoBitsPerSecond: 5_000_000 });
        mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
            recordingStream.getTracks().forEach(track => track.stop());
            recordingStream = null;
            status.innerText = recordedChunks.length ? "Recording ready to download." : "Recording finished with no video data.";
        };
        mediaRecorder.onerror = event => {
            console.error("Recording error", event);
            status.innerText = "Recording failed.";
        };
        mediaRecorder.start(1000);
        isRecording = true;
        recordBtn.innerText = "Stop Recording";
        recordBtn.style.background = "#000";
        status.innerText = "Recording started. Click Generate.";
    }

    function downloadVideo() {
        if (recordedChunks.length === 0) return alert("No video recorded yet.");
        const blob = new Blob(recordedChunks, { type: mediaRecorder?.mimeType || "video/webm" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "mozkoli_whiteboard.webm";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
</script>
</body>
</html>
